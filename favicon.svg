<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Primary Neon Gradient -->
    <linearGradient id="neonCyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Secondary Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Purple Accent Gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pan Shading -->
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#neonCyanPurple)" stroke-width="6" stroke-opacity="0.3" />

  <!-- Central Diamond Frame -->
  <g filter="url(#neonGlow)">
    <!-- Outer Diamond -->
    <polygon points="256,56 456,256 256,456 56,256"
             fill="none"
             stroke="url(#neonCyanPurple)"
             stroke-width="14"
             stroke-linejoin="round" />

    <!-- Inner Diamond Accent Trim -->
    <polygon points="256,92 420,256 256,420 92,256"
             fill="#020617"
             fill-opacity="0.5"
             stroke="#38bdf8"
             stroke-width="3"
             stroke-opacity="0.3"
             stroke-linejoin="round" />

    <!-- Corner Bracket Details -->
    <path d="M 120,220 L 80,256 L 120,292" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 392,220 L 432,256 L 392,292" fill="none" stroke="#a855f7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- AI Processor Chip (Top Section) -->
  <g id="ai-chip">
    <!-- Traces & Node Dots -->
    <line x1="226" y1="172" x2="226" y2="126" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="226" cy="120" r="7" fill="#7dd3fc" />
    
    <line x1="256" y1="168" x2="256" y2="114" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="256" cy="108" r="8" fill="#38bdf8" />
    
    <line x1="286" y1="172" x2="286" y2="126" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
    <circle cx="286" cy="120" r="7" fill="#7dd3fc" />

    <!-- Side Traces -->
    <path d="M 204,196 L 166,196 L 150,214" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <circle cx="146" cy="214" r="6" fill="#38bdf8" />

    <path d="M 308,196 L 346,196 L 362,214" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" />
    <circle cx="366" cy="214" r="6" fill="#c084fc" />

    <!-- Chip Body -->
    <rect x="206" y="166" width="100" height="80" rx="14" fill="#090d16" stroke="url(#cyanGrad)" stroke-width="6" />

    <!-- Chip Core Die -->
    <rect x="232" y="186" width="48" height="40" rx="8" fill="#0284c7" fill-opacity="0.35" stroke="#7dd3fc" stroke-width="4" />
    <circle cx="256" cy="206" r="6" fill="#ffffff" />
  </g>

  <!-- Evaluation Balance Scales (Bottom Section) -->
  <g id="eval-scales">
    <!-- Scale Arch Beam -->
    <path d="M 160,288 Q 256,248 352,288" fill="none" stroke="url(#neonCyanPurple)" stroke-width="10" stroke-linecap="round" />

    <!-- Central Indicator Fulcrum Needle -->
    <polygon points="250,254 262,254 259,348 253,348" fill="url(#cyanGrad)" />
    <circle cx="256" cy="256" r="9" fill="#ffffff" stroke="#0284c7" stroke-width="3" />

    <!-- Left Pan Assembly -->
    <line x1="160" y1="288" x2="136" y2="340" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <line x1="160" y1="288" x2="184" y2="340" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
    <!-- Left Triangular Pan -->
    <polygon points="130,340 190,340 160,370" fill="url(#panGrad)" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round" />

    <!-- Right Pan Assembly -->
    <line x1="352" y1="288" x2="328" y2="340" stroke="#a855f7" stroke-width="5" stroke-linecap="round" />
    <line x1="352" y1="288" x2="376" y2="340" stroke="#a855f7" stroke-width="5" stroke-linecap="round" />
    <!-- Right Triangular Pan -->
    <polygon points="322,340 382,340 352,370" fill="url(#panGrad)" stroke="#c084fc" stroke-width="6" stroke-linejoin="round" />

    <!-- Lower Chevron / Benchmark Gauge Base -->
    <path d="M 226,380 L 256,410 L 286,380" fill="none" stroke="url(#purpleGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 238,402 L 256,420 L 274,402" fill="none" stroke="#a855f7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
